<section class="flex flex-col gap-5" [attr.aria-busy]="loading()">
  <header>
    <h1 class="flex items-center gap-2 text-2xl font-semibold tracking-tight"><ng-icon name="lucideGitCompareArrows" />{{ 'ai.compare.title' | transloco }}</h1>
    <p class="text-muted-foreground mt-1 text-sm">{{ 'ai.compare.subtitle' | transloco }}</p>
  </header>
  <app-ai-provider-banner uses="text" />

  @if (!styleId()) {
    <section hlmCard class="gap-3 p-5">
      <label class="text-sm font-medium" for="compare-style">{{ 'ai.compare.pickStyle' | transloco }}</label>
      <app-style-picker inputId="compare-style" label="ai.compare.pickStyle" (picked)="pickStyle($event)" />
      <p class="text-muted-foreground text-xs">{{ 'ai.compare.pickHint' | transloco }}</p>
    </section>
  } @else {
    @if (loading()) {
      <div hlmSkeleton class="h-40 w-full"></div>
      <div hlmSkeleton class="h-72 w-full"></div>
    } @else if (problem()) {
      <section hlmCard class="gap-3 p-5">
        <p class="text-sm">{{ problem() }}</p>
        <label class="text-sm font-medium" for="compare-from">{{ 'ai.compare.pickFrom' | transloco }}</label>
        <app-style-picker inputId="compare-from" label="ai.compare.pickFrom" (picked)="pickFrom($event)" />
        <button hlmBtn variant="ghost" type="button" class="h-11 w-fit lg:h-9" (click)="clear()"><ng-icon name="lucideX" />{{ 'ai.compare.startOver' | transloco }}</button>
      </section>
    } @else if (diff(); as d) {
      <app-style-diff [diff]="d">
        <div class="flex flex-col gap-2 border-t pt-4 sm:flex-row sm:items-end">
          <div class="flex-1">
            <label class="text-muted-foreground mb-1 block text-xs" for="compare-other">{{ 'ai.compare.compareOther' | transloco }}</label>
            <app-style-picker inputId="compare-other" label="ai.compare.compareOther" (picked)="pickFrom($event)" />
          </div>
          <button hlmBtn variant="ghost" type="button" class="h-11 lg:h-9" (click)="clear()"><ng-icon name="lucideX" />{{ 'ai.compare.startOver' | transloco }}</button>
        </div>
        <app-compare-summary-card diffSummary [diff]="d" />
      </app-style-diff>
    }
  }
</section>
